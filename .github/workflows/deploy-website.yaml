name: Deploy website

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-lab-webpage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, lab-webpage]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build in Docker and deploy static output
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d "${RUNNER_TEMP}/lab-webpage.XXXXXX")"
          trap 'rm -rf "$output_dir"' EXIT
          DOCKER_BUILDKIT=1 docker build --pull --target artifact \
            --output "type=local,dest=${output_dir}" .
          test -s "$output_dir/index.html"
          # Require the completed backup and web-root migration.
          grep -qx 'plml-static-root-v1' /var/www/.lab-webpage-root-deployed
          rsync -av --no-owner --no-group --chmod=D755,F644 --delete "$output_dir/" /var/www/html/
