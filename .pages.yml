media:
  - name: images
    label: Images
    input: images
    output: images
    rename: safe
  - name: member_images
    label: Member Images
    input: images/members
    output: images/members
    rename: safe
  - name: publication_images
    label: Publication Images
    input: images/publications
    output: images/publications
    rename: safe

settings:
  hide: true
  content:
    merge: true

components:
  nav:
    label: Navigation
    type: object
    fields:
      - name: order
        label: Menu Order
        type: number
        required: true
      - name: tooltip
        label: Tooltip
        type: string
        required: false

  member_links:
    label: Links
    type: object
    fields:
      - name: email
        label: Email
        type: string
        required: false
      - name: home-page
        label: Home Page
        type: string
        required: false
      - name: github
        label: GitHub
        type: string
        required: false
      - name: google-scholar
        label: Google Scholar
        type: string
        required: false
      - name: dblp
        label: DBLP
        type: string
        required: false
      - name: researchgate
        label: ResearchGate
        type: string
        required: false
      - name: linkedin
        label: LinkedIn
        type: string
        required: false
      - name: orcid
        label: ORCID
        type: string
        required: false

  education_entry:
    label: Education Entry
    type: object
    fields:
      - name: degree
        label: Degree
        type: select
        required: true
        options:
          values:
            - value: Ph.D.
              label: Ph.D.
            - value: Ph.D. coursework completed
              label: Ph.D. Coursework Completed
            - value: M.S.
              label: M.S.
            - value: M.S. coursework completed
              label: M.S. Coursework Completed
            - value: B.S.
              label: B.S.
      - name: major
        label: Major
        type: string
        required: false
      - name: thesis
        label: Thesis
        type: string
        required: false
      - name: date
        label: Date Acquired
        type: string
        required: true
        description: "Date acquired. Example: 2026.2"

  action_button:
    label: URL
    type: object
    fields:
      - name: text
        label: Label
        type: string
        required: true
        description: "Button text. Examples: DOI, PDF, GitHub"
      - name: link
        label: URL
        type: string
        required: true
        description: "Destination URL. Examples: https://doi.org/..., /files/paper.pdf, https://github.com/..."
      - name: icon
        label: Icon
        type: select
        required: false
        description: "Optional icon matching the URL type."
        options:
          values:
            - value: fa-solid fa-file-lines
              label: Document
            - value: fa-brands fa-github
              label: GitHub
            - value: fa-solid fa-link
              label: Link
            - value: fa-solid fa-code
              label: Code

  course_semester:
    label: Semester
    type: object
    fields:
      - name: year
        label: Year
        type: number
        required: true
      - name: term
        label: Term
        type: select
        required: true
        options:
          values:
            - value: spring
              label: Spring
            - value: summer
              label: Summer
            - value: fall
              label: Fall
            - value: winter
              label: Winter

content:
  - name: home
    label: Home
    type: file
    path: index.md
    fields:
      - name: header-dark
        label: Dark Header
        type: boolean
        required: false
      - name: show-title
        label: Show Title
        type: boolean
        required: false
      - name: show-subtitle
        label: Show Subtitle
        type: boolean
        required: false
      - name: body
        label: Body
        type: code
        options:
          language: markdown

  - name: contact_page
    label: Contact Page
    type: file
    path: contact/index.md
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: nav
        component: nav
        required: false
      - name: body
        label: Body
        type: code
        options:
          language: markdown

  - name: members
    label: Members
    type: collection
    path: _members
    subfolders: false
    filename: "{name_en}.md"
    view:
      primary: name
      fields: [name, name_en, role, "education[0].degree"]
      sort: [name, name_en, role]
      default:
        sort: role
        order: desc
    fields:
      - name: name
        label: Korean Name
        type: string
        required: true
      - name: name_en
        label: English Name
        type: string
        required: true
      - name: image
        label: Image
        type: image
        required: false
        options:
          media: member_images
      - name: role
        label: Role
        type: select
        required: true
        options:
          values:
            - value: principal-investigator
              label: Principal Investigator
            - value: postdoc
              label: Postdoc
            - value: phd
              label: PhD Student
            - value: ms
              label: MS Student
            - value: undergrad
              label: Undergraduate Researcher
            - value: alumni
              label: Alumni
      - name: affiliation
        label: Affiliation
        type: string
        required: false
      - name: career
        label: Other Career
        type: string
        required: false
        list: true
        description: "Other career history shown above education. Example: Postdoc. at the ABC Lab., XYZ Univ., 20xx.x-20xx.x"
      - name: education
        label: Education / Alumni History
        component: education_entry
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{fields.degree} {fields.date}"
      - name: aliases
        label: Aliases
        type: string
        required: false
        list: true
        description: "Names entered here are also used to match this member with author names in publications."
      - name: links
        component: member_links
        required: false
      - name: body
        label: Bio / Notes
        type: code
        required: false
        options:
          language: markdown

  - name: news_posts
    label: News Posts
    type: collection
    path: _posts
    subfolders: false
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      primary: title
      fields: [title, date, "tags[0]"]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: Body
        type: code
        options:
          language: markdown
      - name: tags
        label: Tags
        type: select
        required: false
        list: true
        options:
          values:
            - value: publication
              label: Publication
            - value: graduation
              label: Graduation
            - value: welcome
              label: Welcome
            - value: conference
              label: Conference
            - value: award
              label: Award

  - name: publications
    label: Publications
    type: collection
    path: _publications
    subfolders: false
    filename: "{title}.md"
    view:
      primary: title
      fields: [title, kind, scope, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: scope
        label: Scope
        type: select
        required: true
        options:
          values:
            - value: international
              label: International
            - value: domestic
              label: Domestic
      - name: kind
        label: Kind
        type: select
        required: true
        options:
          values:
            - value: conference
              label: Conference
            - value: journal
              label: Journal
      - name: subtitle
        label: Subtitle
        type: string
        required: true
        description: "Full citation text shown on the publication detail page."
      - name: venue
        label: Venue
        type: string
        required: true
        description: "Short venue name shown on publication cards and the home page."
      - name: venue_url
        label: Venue URL
        type: string
        required: false
        description: "Optional link to the conference or journal venue website."
      - name: abstract
        label: Abstract
        type: code
        required: false
        options:
          language: markdown
      - name: image
        label: Image
        type: image
        required: false
        description: "Leave blank to generate an image automatically."
        options:
          media: publication_images
      - name: authors
        label: Authors
        type: string
        required: true
        list: true
        description: "Append `*` to an author name to mark equal contributions (shown as `(* equal contributions)`)."
      - name: awards
        label: Awards
        type: string
        required: false
        list: true
        description: "Optional awards for this publication. Example: 우수논문상"
      - name: support
        label: Support
        type: string
        required: false
        list: true
        description: "Optional supporting project or funding information. Example: 지역지능화"
      - name: tags
        label: Tags
        type: string
        required: false
        list: true
        description: "Leave blank to let tags be set automatically."
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: buttons
        label: URLs
        component: action_button
        required: false
        description: "Optional links related to the publication. Add entries such as DOI, PDF, or GitHub."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.text}"

  - name: courses
    label: Courses
    type: collection
    path: _courses
    subfolders: false
    filename: "{title_en}.md"
    view:
      primary: title
      fields: [title, title_en, "semesters[0].label"]
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: title_en
        label: English Title
        type: string
        required: false
      - name: description
        label: Notes
        type: text
        required: false
      - name: tags
        label: Tags
        type: string
        required: false
        list: true
      - name: semesters
        label: Semesters
        component: course_semester
        required: true
        list:
          collapsible:
            collapsed: true
            summary: "{fields.year} {fields.term}"
